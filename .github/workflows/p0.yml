name: p0
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-must-be-long-enough-32-bytes
      ADMIN_PASSWORD: ci-admin-pass
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: legalrag
      POSTGRES_USER: legalrag
      POSTGRES_PASSWORD: legalrag
      REDIS_URL: redis://localhost:6379/0
      TEI_EMBED_URL: http://localhost:8080
      TEI_RERANK_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff
        working-directory: backend
        run: ruff check .

      - name: Pytest (unit tests use SQLite; no live services needed)
        working-directory: backend
        run: pytest -q
