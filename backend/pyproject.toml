[project]
name = "legal-rag-v3-backend"
version = "0.1.0"
description = "Kuwaiti Legal Opinion Verification Platform — backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.34,<0.36",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.16",
    "pgvector>=0.3.6,<0.4",
    "argon2-cffi>=23.1,<25",
    "pyjwt[crypto]>=2.10,<3",
    "python-multipart>=0.0.20,<0.1",
    "httpx>=0.28,<0.29",
    "arq>=0.26,<0.27",
    "boto3>=1.35,<2",
    "structlog>=24.4,<26",
    "prometheus-client>=0.21,<0.22",
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
    "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
    "anthropic>=0.42,<1",
    "psycopg2-binary>=2.9,<3",  # alembic env.py uses the sync psycopg2 driver
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2",
    "types-boto3>=1.0,<2",
    "faker>=33,<34",
    "aiosqlite>=0.20,<0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: needs a live ParadeDB (set V3_INTEGRATION=1)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# Arabic text is the product; "ambiguous unicode" rules are noise here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/db/alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
